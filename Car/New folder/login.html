<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body class="login-page">

        <div class="logo">
            <a href="index.html"><img src="assets/logo.png" alt="CarFusion Logo" style="height: 40px;"></a>
        </div>
    </header>
    <main class="login-container">
        <div class="login-card">
            <div class="form-toggle">
                <button class="toggle-btn active" onclick="showForm('login')">Login Page</button>
              
            </div>
            <form id="login-form" class="login-form" onsubmit="loginUser(event)">
                <div class="form-group">
                    <input type="tel" id="login-mobile" pattern="\d{10}" required placeholder="Mobile (+91)">
                </div>
                <div class="form-group">
                    <input type="password" id="login-password" required placeholder="Password">
                </div>
                <div id="login-error" class="error"></div>
                <button type="submit" class="btn login-btn">Login</button>
            </form>
            <form id="signup-form" class="signup-form hidden" onsubmit="signupUser(event)">
                <div class="form-group">
                    <input type="text" id="signup-name" required placeholder="Full Name">
                </div>
                <div class="form-group">
                    <input type="tel" id="signup-mobile" pattern="\d{10}" required placeholder="Mobile (+91)">
                </div>
                <div class="form-group">
                    <input type="password" id="signup-password" required placeholder="Password (Caps, Special, Number)">
                </div>
                <div id="signup-error" class="error"></div>
                <button type="submit" class="btn login-btn">Signup</button>
            </form>
        </div>
    </main>
    <div id="toast" class="toast"></div>
</body>
